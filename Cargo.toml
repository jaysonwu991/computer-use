[package]
name = "oxide-computer-use"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Computer Use MCP server and CLI for Oxide: drive desktop apps through native accessibility APIs"
license = "MIT"
repository = "https://github.com/jayson/oxide-computer-use"
readme = "README.md"

[[bin]]
name = "oxide-computer-use"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"
